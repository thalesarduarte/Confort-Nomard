[project]
name = "comfort-nomad-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<4",
  "Flask-Cors>=5,<6",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "PyJWT>=2.10,<3",
  "gunicorn>=23,<24",
]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
