services:
  - type: web
    name: comfort-nomad-api
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    preDeployCommand: alembic upgrade head
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: comfort-nomad-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: comfort-nomad-api
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: "900"
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: comfort-nomad-db
    databaseName: comfort_nomad
    user: comfort_nomad
    plan: basic-256mb
    postgresMajorVersion: "16"
